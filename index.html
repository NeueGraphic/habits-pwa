<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Habits</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
/* ── Design Tokens ── */
:root {
  --bg-primary:    #F2F2F7;
  --bg-secondary:  #FFFFFF;
  --bg-tertiary:   #EFEFF4;
  --surface:       #FFFFFF;
  --surface-2:     #F2F2F7;
  --label-primary:   #000000;
  --label-secondary: rgba(60,60,67,.6);
  --label-tertiary:  rgba(60,60,67,.3);
  --separator:       rgba(60,60,67,.12);
  --blue:    #007AFF; --blue-t:   rgba(0,122,255,.12);
  --green:   #34C759; --green-t:  rgba(52,199,89,.12);
  --red:     #FF3B30;
  --orange:  #FF9500;
  --purple:  #AF52DE;
  --pink:    #FF2D55;
  --teal:    #5AC8FA;
  --indigo:  #5856D6;
  --card-r:  20px;
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg-primary:    #000000;
    --bg-secondary:  #1C1C1E;
    --bg-tertiary:   #2C2C2E;
    --surface:       #1C1C1E;
    --surface-2:     #2C2C2E;
    --label-primary:   #FFFFFF;
    --label-secondary: rgba(235,235,245,.6);
    --label-tertiary:  rgba(235,235,245,.18);
    --separator:       rgba(84,84,88,.6);
    --blue:    #0A84FF; --blue-t:   rgba(10,132,255,.15);
    --green:   #30D158; --green-t:  rgba(48,209,88,.15);
    --red:     #FF453A;
    --orange:  #FF9F0A;
    --purple:  #BF5AF2;
    --pink:    #FF375F;
    --teal:    #64D2FF;
    --indigo:  #5E5CE6;
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:var(--font);background:var(--bg-primary);color:var(--label-primary);-webkit-font-smoothing:antialiased;overscroll-behavior:none;}

/* ── App Shell ── */
#app{max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative;}
@media(min-width:431px){#app{border-left:.5px solid var(--separator);border-right:.5px solid var(--separator);}}

/* ── Nav Bar ── */
.nav-bar{
  position:sticky;top:0;z-index:100;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 20px 12px;
  background:rgba(242,242,247,.88);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:.5px solid var(--separator);
  display:flex;align-items:flex-end;justify-content:space-between;
}
@media(prefers-color-scheme:dark){.nav-bar{background:rgba(0,0,0,.88);}}
.nav-title{font-size:34px;font-weight:700;letter-spacing:-.5px;line-height:1;}
.nav-sub{font-size:13px;font-weight:500;color:var(--label-secondary);padding-bottom:2px;}
.icon-btn{
  width:36px;height:36px;border-radius:50%;border:none;
  background:var(--surface-2);color:var(--blue);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:transform .15s ease,background .15s ease;
}
.icon-btn:active{transform:scale(.88);}

/* ── Main ── */
main{flex:1;padding:20px 16px 120px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
main.hidden{display:none;}

/* ── Summary Card ── */
.summary-card{
  background:var(--surface);border-radius:var(--card-r);
  padding:20px;margin-bottom:20px;
  box-shadow:0 1px 4px rgba(0,0,0,.06);
  display:flex;align-items:center;gap:20px;
}
.ring-wrap{position:relative;width:80px;height:80px;flex-shrink:0;}
.ring-svg{transform:rotate(-90deg);}
.ring-track{fill:none;stroke:var(--bg-tertiary);stroke-width:8;}
.ring-fill{fill:none;stroke:var(--green);stroke-width:8;stroke-linecap:round;
  transition:stroke-dashoffset .65s cubic-bezier(.34,1.56,.64,1);}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-n{font-size:22px;font-weight:700;line-height:1;}
.ring-d{font-size:11px;font-weight:500;color:var(--label-secondary);}
.summary-text{flex:1;}
.summary-greeting{font-size:18px;font-weight:700;margin-bottom:4px;}
.summary-sub{font-size:14px;color:var(--label-secondary);line-height:1.45;}

/* ── Section Header ── */
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin:4px 4px 10px;}
.section-lbl{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--label-secondary);}

/* ── Habits List ── */
.habits-list{display:flex;flex-direction:column;gap:10px;}

/* ── Habit Card ── */
.habit-card{
  background:var(--surface);border-radius:var(--card-r);
  box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden;
  animation:card-in .32s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes card-in{from{opacity:0;transform:translateY(10px) scale(.97);}to{opacity:1;transform:none;}}
.habit-card.out{animation:card-out .25s ease forwards;}
@keyframes card-out{to{opacity:0;transform:translateX(48px) scale(.95);}}

.habit-main{
  display:flex;align-items:center;padding:14px 16px;gap:14px;
  cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
}
.habit-icon{
  width:44px;height:44px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
  transition:transform .22s cubic-bezier(.34,1.56,.64,1);
}
.habit-info{flex:1;min-width:0;}
.habit-name{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.habit-meta{display:flex;align-items:center;gap:6px;margin-top:3px;}
.streak{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--orange);}
.no-streak{font-size:12px;font-weight:500;color:var(--label-tertiary);}

/* ── Check Button ── */
.chk{
  width:32px;height:32px;border-radius:50%;border:2.5px solid var(--separator);
  background:transparent;display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;-webkit-tap-highlight-color:transparent;
  position:relative;overflow:hidden;
  transition:border-color .22s cubic-bezier(.34,1.56,.64,1);
}
.chk::before{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:var(--green);transform:scale(0);
  transition:transform .22s cubic-bezier(.34,1.56,.64,1);
}
.chk.on{border-color:var(--green);}
.chk.on::before{transform:scale(1);}
.chk svg{position:relative;z-index:1;color:transparent;transition:color .18s ease;}
.chk.on svg{color:#fff;}
/* Ripple */
.chk.rip::after{
  content:'';position:absolute;inset:-8px;border-radius:50%;
  background:var(--green-t);animation:rip .38s ease forwards;
}
@keyframes rip{from{opacity:1;transform:scale(.5);}to{opacity:0;transform:scale(1.6);}}

/* ── Week Row ── */
.week-row{display:flex;padding:0 16px 14px;gap:4px;}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;}
.wd-lbl{font-size:10px;font-weight:600;color:var(--label-tertiary);text-transform:uppercase;}
.wd-dot{
  width:24px;height:24px;border-radius:50%;
  background:var(--bg-tertiary);
  display:flex;align-items:center;justify-content:center;
  transition:background .2s ease;
}
.wd-dot.done{background:var(--green);}
.wd-dot.today{box-shadow:0 0 0 2px var(--blue);}
.wd-dot svg{width:10px;height:10px;color:#fff;}

/* ── Action Row ── */
.habit-actions{
  display:flex;padding:10px 16px 14px;gap:8px;
  border-top:.5px solid var(--separator);
  animation:slide-dn .18s ease both;
}
.habit-actions.hidden{display:none;}
@keyframes slide-dn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.act-btn{
  flex:1;padding:8px;border-radius:10px;border:none;
  font-size:13px;font-weight:600;font-family:var(--font);
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;
  -webkit-tap-highlight-color:transparent;
  transition:transform .14s ease,opacity .14s ease;
}
.act-btn:active{transform:scale(.93);opacity:.7;}
.act-btn.edit{background:var(--blue-t);color:var(--blue);}
.act-btn.del{background:rgba(255,59,48,.1);color:var(--red);}

/* ── Empty State ── */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:64px 24px;gap:12px;animation:fade-in .35s ease;}
@keyframes fade-in{from{opacity:0;}to{opacity:1;}}
.empty-ico{width:72px;height:72px;border-radius:20px;background:var(--blue-t);display:flex;align-items:center;justify-content:center;margin-bottom:4px;}
.empty-ico svg{width:36px;height:36px;color:var(--blue);}
.empty-title{font-size:20px;font-weight:700;}
.empty-sub{font-size:15px;color:var(--label-secondary);line-height:1.5;max-width:240px;}
.empty-cta{
  margin-top:8px;padding:14px 32px;background:var(--blue);color:#fff;
  border:none;border-radius:14px;font-size:16px;font-weight:600;font-family:var(--font);
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:transform .14s ease,opacity .14s ease;
}
.empty-cta:active{transform:scale(.95);opacity:.8;}

/* ── Tab Bar ── */
.tab-bar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:430px;
  background:rgba(242,242,247,.9);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-top:.5px solid var(--separator);
  padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));
  display:flex;z-index:100;
}
@media(prefers-color-scheme:dark){.tab-bar{background:rgba(28,28,30,.9);}}
@media(min-width:431px){.tab-bar{border-left:.5px solid var(--separator);border-right:.5px solid var(--separator);}}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  border:none;background:transparent;font-family:var(--font);cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1);
}
.tab:active{transform:scale(.86);}
.tab svg{width:24px;height:24px;transition:color .15s;}
.tab span{font-size:10px;font-weight:500;transition:color .15s;}
.tab.active svg,.tab.active span{color:var(--blue);}
.tab:not(.active) svg,.tab:not(.active) span{color:var(--label-secondary);}

/* ── FAB ── */
.fab{
  position:fixed;bottom:calc(78px + env(safe-area-inset-bottom,0px));
  right:max(16px, calc(50% - 215px + 16px));
  width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;
  border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 4px 14px rgba(0,122,255,.42);z-index:99;
  -webkit-tap-highlight-color:transparent;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease;
}
.fab:active{transform:scale(.88);box-shadow:0 2px 8px rgba(0,122,255,.28);}

/* ── Sheet ── */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.38);
  backdrop-filter:blur(2px);
  z-index:200;display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .22s ease;
}
.overlay.open{opacity:1;pointer-events:auto;}
.sheet{
  width:100%;max-width:430px;background:var(--surface);
  border-radius:20px 20px 0 0;
  padding:0 0 calc(24px + env(safe-area-inset-bottom,0px));
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(.32,.72,0,1);
  max-height:90dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.overlay.open .sheet{transform:translateY(0);}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--label-tertiary);margin:10px auto 0;}
.sheet-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px;}
.sheet-title{font-size:18px;font-weight:700;}
.sheet-cancel{background:none;border:none;font-size:16px;color:var(--blue);cursor:pointer;font-family:var(--font);-webkit-tap-highlight-color:transparent;}
.sheet-body{padding:8px 20px 0;}

/* ── Form ── */
.form-section{background:var(--bg-tertiary);border-radius:14px;overflow:hidden;margin-bottom:14px;}
.form-row{display:flex;align-items:center;padding:14px 16px;gap:12px;border-bottom:.5px solid var(--separator);}
.form-row:last-child{border-bottom:none;}
.form-lbl{font-size:15px;font-weight:500;min-width:56px;flex-shrink:0;}
.form-inp{
  flex:1;border:none;background:transparent;font-size:15px;
  font-family:var(--font);color:var(--label-primary);outline:none;text-align:right;
}
.form-inp::placeholder{color:var(--label-tertiary);}
.picker-wrap{padding:14px 16px;}
.picker-lbl{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--label-secondary);margin-bottom:10px;}

/* ── Emoji Grid ── */
.emoji-grid{display:flex;flex-wrap:wrap;gap:8px;}
.e-btn{
  width:44px;height:44px;border-radius:10px;border:2px solid transparent;
  background:var(--surface);font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1),border-color .15s;
}
.e-btn:active{transform:scale(.86);}
.e-btn.sel{border-color:var(--blue);}

/* ── Color Grid ── */
.color-grid{display:flex;gap:10px;flex-wrap:wrap;}
.c-swatch{
  width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;
  position:relative;-webkit-tap-highlight-color:transparent;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1);
}
.c-swatch:active{transform:scale(.82);}
.c-swatch.sel::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:2.5px solid currentColor;}

.save-btn{
  width:100%;padding:16px;background:var(--blue);color:#fff;
  border:none;border-radius:14px;font-size:16px;font-weight:600;font-family:var(--font);
  margin-top:4px;cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:transform .14s ease,opacity .14s ease;
}
.save-btn:active{transform:scale(.97);opacity:.82;}

/* ── Stats View ── */
.stats-card{background:var(--surface);border-radius:var(--card-r);padding:20px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.stats-lbl{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--label-secondary);margin-bottom:16px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.stat-box{background:var(--bg-tertiary);border-radius:14px;padding:14px;text-align:center;}
.stat-n{font-size:28px;font-weight:700;line-height:1;}
.stat-l{font-size:12px;font-weight:500;color:var(--label-secondary);margin-top:4px;}
.hstat-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:.5px solid var(--separator);}
.hstat-row:last-child{border-bottom:none;}
.hstat-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.hstat-info{flex:1;}
.hstat-name{font-size:15px;font-weight:600;}
.hstat-sub{font-size:12px;color:var(--label-secondary);margin-top:2px;}
.hstat-rate{font-size:15px;font-weight:700;color:var(--green);}

/* ── Confetti ── */
.confetti-cvs{position:fixed;inset:0;pointer-events:none;z-index:999;}

/* ── Misc ── */
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
::-webkit-scrollbar{width:0;}
</style>
</head>
<body>
<div id="app">

  <!-- Nav -->
  <header class="nav-bar">
    <div>
      <div class="nav-title">Habits</div>
      <div class="nav-sub" id="nav-date"></div>
    </div>
    <button class="icon-btn" id="edit-btn" title="Manage habits">
      <i data-lucide="sliders-horizontal" style="width:18px;height:18px;"></i>
    </button>
  </header>

  <!-- Today View -->
  <main id="view-today">
    <!-- Progress Ring -->
    <div class="summary-card">
      <div class="ring-wrap">
        <svg class="ring-svg" width="80" height="80" viewBox="0 0 80 80">
          <circle class="ring-track" cx="40" cy="40" r="33"/>
          <circle class="ring-fill" id="ring" cx="40" cy="40" r="33"
                  stroke-dasharray="207.35" stroke-dashoffset="207.35"/>
        </svg>
        <div class="ring-center">
          <span class="ring-n" id="ring-n">0</span>
          <span class="ring-d" id="ring-d">/0</span>
        </div>
      </div>
      <div class="summary-text">
        <div class="summary-greeting" id="greeting">Good morning!</div>
        <div class="summary-sub" id="summary-sub">Let's build great habits.</div>
      </div>
    </div>

    <div class="section-hdr">
      <span class="section-lbl">Today</span>
    </div>

    <div class="habits-list" id="habit-list"></div>

    <div class="empty" id="empty-state">
      <div class="empty-ico"><i data-lucide="sparkles"></i></div>
      <div class="empty-title">Build great habits</div>
      <div class="empty-sub">Track daily habits and watch your streaks grow.</div>
      <button class="empty-cta" id="add-first">Add First Habit</button>
    </div>
  </main>

  <!-- Stats View -->
  <main id="view-stats" class="hidden">
    <div class="stats-card">
      <div class="stats-lbl">Overview</div>
      <div class="stat-grid">
        <div class="stat-box"><div class="stat-n" id="st-total">0</div><div class="stat-l">Habits</div></div>
        <div class="stat-box"><div class="stat-n" id="st-today">0</div><div class="stat-l">Done Today</div></div>
        <div class="stat-box"><div class="stat-n" id="st-streak">0</div><div class="stat-l">Best Streak 🔥</div></div>
        <div class="stat-box"><div class="stat-n" id="st-rate">0%</div><div class="stat-l">This Week</div></div>
      </div>
    </div>
    <div class="stats-card">
      <div class="stats-lbl">Habit Details</div>
      <div id="hstat-list"></div>
    </div>
  </main>

  <!-- Tab Bar -->
  <nav class="tab-bar">
    <button class="tab active" id="tab-today" onclick="switchTab('today')">
      <i data-lucide="sun"></i><span>Today</span>
    </button>
    <button class="tab" id="tab-stats" onclick="switchTab('stats')">
      <i data-lucide="bar-chart-2"></i><span>Stats</span>
    </button>
  </nav>

  <!-- FAB -->
  <button class="fab" id="fab">
    <i data-lucide="plus" style="width:28px;height:28px;"></i>
  </button>
</div>

<!-- Sheet -->
<div class="overlay" id="overlay" onclick="maybeClose(event)">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Habit editor">
    <div class="sheet-handle"></div>
    <div class="sheet-hdr">
      <span class="sheet-title" id="sheet-title">New Habit</span>
      <button class="sheet-cancel" onclick="closeSheet()">Cancel</button>
    </div>
    <div class="sheet-body">

      <div class="form-section">
        <div class="form-row">
          <span class="form-lbl">Name</span>
          <input class="form-inp" id="inp-name" type="text" placeholder="e.g. Morning Run" maxlength="32" autocomplete="off" spellcheck="false">
        </div>
      </div>

      <div class="form-section picker-wrap">
        <div class="picker-lbl">Icon</div>
        <div class="emoji-grid" id="emoji-grid"></div>
      </div>

      <div class="form-section picker-wrap">
        <div class="picker-lbl">Color</div>
        <div class="color-grid" id="color-grid"></div>
      </div>

      <button class="save-btn" id="save-btn" onclick="saveHabit()">Add Habit</button>
    </div>
  </div>
</div>

<script>
/* ─────────────────────────────────────────
   Constants
───────────────────────────────────────── */
const STORE_KEY = 'habitsApp_v3';

const COLORS = [
  { id:'blue',   light:'#007AFF', dark:'#0A84FF' },
  { id:'green',  light:'#34C759', dark:'#30D158' },
  { id:'orange', light:'#FF9500', dark:'#FF9F0A' },
  { id:'red',    light:'#FF3B30', dark:'#FF453A' },
  { id:'purple', light:'#AF52DE', dark:'#BF5AF2' },
  { id:'pink',   light:'#FF2D55', dark:'#FF375F' },
  { id:'teal',   light:'#5AC8FA', dark:'#64D2FF' },
  { id:'indigo', light:'#5856D6', dark:'#5E5CE6' },
];

const EMOJIS = ['🏃','💪','🧘','📚','💧','🥗','😴','🎯','✍️','🎸',
                 '🌿','🧹','💊','🚴','🏊','🍎','🧠','❤️','🌅','🎨',
                 '☀️','🏋️','🎻','🧩','🌙','🧴','🦷','🛌','📝','🔑'];

const CIRC = 2 * Math.PI * 33; // 207.35

/* ─────────────────────────────────────────
   State
───────────────────────────────────────── */
let data       = load();
let editId     = null;
let selEmoji   = '🎯';
let selColor   = 'blue';
let activeTab  = 'today';
let openCard   = null;   // id of card with actions shown
let isDark     = window.matchMedia('(prefers-color-scheme:dark)').matches;

/* ─────────────────────────────────────────
   Persistence
───────────────────────────────────────── */
function load() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {habits:[]}; }
  catch { return {habits:[]}; }
}
function save() { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }

/* ─────────────────────────────────────────
   Date helpers
───────────────────────────────────────── */
function dateKey(d = new Date()) { return d.toISOString().slice(0,10); }

function weekDays() {
  const today = new Date();
  const LABELS = ['S','M','T','W','T','F','S'];
  return Array.from({length:7}, (_,i) => {
    const d = new Date(today);
    d.setDate(today.getDate() - (6-i));
    return { key: dateKey(d), label: LABELS[d.getDay()], isToday: i===6 };
  });
}

/* ─────────────────────────────────────────
   Habit helpers
───────────────────────────────────────── */
function calcStreak(h) {
  const today = new Date();
  let n = 0;
  for (let i=0; i<365; i++) {
    const d = new Date(today);
    d.setDate(today.getDate()-i);
    if (h.completions[dateKey(d)]) n++;
    else break;
  }
  return n;
}

function calcWeekRate(h) {
  const done = weekDays().filter(d => h.completions[d.key]).length;
  return Math.round(done/7*100);
}

function colorHex(id) {
  const c = COLORS.find(c=>c.id===id) || COLORS[0];
  return isDark ? c.dark : c.light;
}

/* ─────────────────────────────────────────
   Render: Nav date
───────────────────────────────────────── */
function renderDate() {
  document.getElementById('nav-date').textContent =
    new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
}

/* ─────────────────────────────────────────
   Render: Summary ring
───────────────────────────────────────── */
function renderSummary() {
  const today = dateKey();
  const total = data.habits.length;
  const done  = data.habits.filter(h=>h.completions[today]).length;
  const pct   = total ? done/total : 0;

  document.getElementById('ring').style.strokeDashoffset = CIRC - pct*CIRC;
  document.getElementById('ring-n').textContent = done;
  document.getElementById('ring-d').textContent = '/'+total;

  const hr = new Date().getHours();
  document.getElementById('greeting').textContent =
    hr<12 ? 'Good morning!' : hr<17 ? 'Good afternoon!' : 'Good evening!';

  let sub;
  if (total===0)        sub = 'Tap + to add your first habit.';
  else if (done===total) sub = 'All done — incredible work today! 🎉';
  else if (done===0)     sub = `${total} habit${total>1?'s':''} to complete today.`;
  else                   sub = `${done} of ${total} done. Keep pushing!`;
  document.getElementById('summary-sub').textContent = sub;
}

/* ─────────────────────────────────────────
   Render: Habit list
───────────────────────────────────────── */
function renderHabits() {
  renderSummary();

  const list  = document.getElementById('habit-list');
  const empty = document.getElementById('empty-state');

  if (data.habits.length===0) {
    list.innerHTML = '';
    empty.style.display = 'flex';
    return;
  }
  empty.style.display = 'none';

  const today = dateKey();
  const wdays = weekDays();
  const keep  = new Set(data.habits.map(h=>h.id));

  // Remove deleted cards
  [...list.querySelectorAll('.habit-card')].forEach(el => {
    if (!keep.has(el.dataset.id)) el.remove();
  });

  const existing = new Set([...list.querySelectorAll('.habit-card')].map(el=>el.dataset.id));

  data.habits.forEach((h, idx) => {
    if (existing.has(h.id)) {
      refreshCard(h, today, wdays);
    } else {
      const card = buildCard(h, today, wdays);
      card.style.animationDelay = idx*0.05+'s';
      list.appendChild(card);
    }
  });

  // Keep DOM order in sync with data order
  data.habits.forEach(h => list.appendChild(list.querySelector(`[data-id="${h.id}"]`)));
}

function buildCard(h, today, wdays) {
  const div = document.createElement('div');
  div.className = 'habit-card';
  div.dataset.id = h.id;
  div.innerHTML = cardHTML(h, today, wdays);
  return div;
}

function refreshCard(h, today, wdays) {
  const el = document.querySelector(`.habit-card[data-id="${h.id}"]`);
  if (!el) return;
  const wasOpen = openCard===h.id;
  el.innerHTML = cardHTML(h, today, wdays);
  if (wasOpen) el.querySelector('.habit-actions')?.classList.remove('hidden');
}

function cardHTML(h, today, wdays) {
  const checked = !!h.completions[today];
  const streak  = calcStreak(h);
  const color   = colorHex(h.color);

  const dots = wdays.map(d => {
    const done = !!h.completions[d.key];
    const cls  = `wd-dot${done?' done':''}${d.isToday?' today':''}`;
    return `<div class="wd">
      <span class="wd-lbl">${d.label}</span>
      <div class="${cls}">
        ${done?`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`:''}
      </div>
    </div>`;
  }).join('');

  const streakHtml = streak>0
    ? `<span class="streak">
         <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor">
           <path d="M12 2s-5 5.5-5 10a5 5 0 0010 0C17 7.5 12 2 12 2zm0 13a2 2 0 110-4 2 2 0 010 4z"/>
         </svg>${streak} day${streak!==1?'s':''}
       </span>`
    : `<span class="no-streak">Start your streak</span>`;

  return `
    <div class="habit-main" onclick="toggleCard('${h.id}')">
      <div class="habit-icon" style="background:${color}22">${h.emoji}</div>
      <div class="habit-info">
        <div class="habit-name">${esc(h.name)}</div>
        <div class="habit-meta">${streakHtml}</div>
      </div>
      <button class="chk${checked?' on':''}" data-id="${h.id}"
              onclick="event.stopPropagation();check('${h.id}')"
              aria-label="${checked?'Uncheck':'Check'} ${esc(h.name)}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="3"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </button>
    </div>
    <div class="week-row">${dots}</div>
    <div class="habit-actions hidden">
      <button class="act-btn edit" onclick="openEdit('${h.id}')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>Edit
      </button>
      <button class="act-btn del" onclick="deleteHabit('${h.id}')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6M10 11v6M14 11v6M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
        </svg>Delete
      </button>
    </div>`;
}

/* ─────────────────────────────────────────
   Toggle card actions panel
───────────────────────────────────────── */
function toggleCard(id) {
  if (openCard && openCard!==id) {
    const prev = document.querySelector(`.habit-card[data-id="${openCard}"] .habit-actions`);
    if (prev) prev.classList.add('hidden');
  }
  const el = document.querySelector(`.habit-card[data-id="${id}"] .habit-actions`);
  if (!el) return;
  const showing = !el.classList.contains('hidden');
  el.classList.toggle('hidden', showing);
  openCard = showing ? null : id;
}

/* ─────────────────────────────────────────
   Check / uncheck a habit
───────────────────────────────────────── */
function check(id) {
  const h = data.habits.find(h=>h.id===id);
  if (!h) return;
  const today = dateKey();
  const was = !!h.completions[today];

  if (was) delete h.completions[today];
  else {
    h.completions[today] = true;
    vibrate();
    // Animate button
    const btn = document.querySelector(`.chk[data-id="${id}"]`);
    if (btn) {
      btn.classList.add('on','rip');
      setTimeout(()=>btn.classList.remove('rip'),380);
      // Bounce icon
      const ico = btn.closest('.habit-card')?.querySelector('.habit-icon');
      if (ico) { ico.style.transform='scale(1.25)'; setTimeout(()=>ico.style.transform='',220); }
    }
    // Confetti if all done
    if (data.habits.length>1 && data.habits.every(h=>h.completions[today])) {
      setTimeout(confetti,120);
    }
  }

  save();
  renderSummary();

  // Refresh just this card
  const wdays = weekDays();
  refreshCard(h, today, wdays);
  // Restore check state immediately (refreshCard re-renders)
  const btn2 = document.querySelector(`.chk[data-id="${id}"]`);
  if (btn2) btn2.classList.toggle('on', !was);
}

/* ─────────────────────────────────────────
   Delete habit
───────────────────────────────────────── */
function deleteHabit(id) {
  const card = document.querySelector(`.habit-card[data-id="${id}"]`);
  if (card) {
    card.classList.add('out');
    setTimeout(()=>{
      data.habits = data.habits.filter(h=>h.id!==id);
      if (openCard===id) openCard=null;
      save();
      renderHabits();
    }, 250);
  }
}

/* ─────────────────────────────────────────
   Sheet: open / close
───────────────────────────────────────── */
function openAdd() {
  editId=null; selEmoji='🎯'; selColor='blue';
  document.getElementById('sheet-title').textContent = 'New Habit';
  document.getElementById('save-btn').textContent = 'Add Habit';
  document.getElementById('inp-name').value = '';
  buildPickers();
  showSheet();
}

function openEdit(id) {
  const h = data.habits.find(h=>h.id===id);
  if (!h) return;
  editId=id; selEmoji=h.emoji; selColor=h.color;
  document.getElementById('sheet-title').textContent = 'Edit Habit';
  document.getElementById('save-btn').textContent = 'Save Changes';
  document.getElementById('inp-name').value = h.name;
  buildPickers();
  showSheet();
}

function buildPickers() {
  document.getElementById('emoji-grid').innerHTML =
    EMOJIS.map(e=>`<button class="e-btn${e===selEmoji?' sel':''}"
      onclick="pickEmoji('${e}')">${e}</button>`).join('');
  document.getElementById('color-grid').innerHTML =
    COLORS.map(c=>`<button class="c-swatch${c.id===selColor?' sel':''}"
      style="background:${c.light};color:${c.light};" title="${c.id}"
      onclick="pickColor('${c.id}')"></button>`).join('');
}

function pickEmoji(e) {
  selEmoji=e;
  document.querySelectorAll('.e-btn').forEach(b=>b.classList.toggle('sel',b.textContent.trim()===e));
}
function pickColor(id) {
  selColor=id;
  document.querySelectorAll('.c-swatch').forEach(b=>b.classList.toggle('sel',b.title===id));
}

function showSheet() {
  document.getElementById('overlay').classList.add('open');
  setTimeout(()=>document.getElementById('inp-name').focus(), 340);
}
function closeSheet() { document.getElementById('overlay').classList.remove('open'); }
function maybeClose(e) { if(e.target===document.getElementById('overlay')) closeSheet(); }

/* ─────────────────────────────────────────
   Save habit
───────────────────────────────────────── */
function saveHabit() {
  const name = document.getElementById('inp-name').value.trim();
  if (!name) {
    const inp = document.getElementById('inp-name');
    inp.style.animation='shake .3s ease';
    setTimeout(()=>inp.style.animation='',300);
    inp.focus(); return;
  }
  if (editId) {
    const h = data.habits.find(h=>h.id===editId);
    if (h) { h.name=name; h.emoji=selEmoji; h.color=selColor; }
  } else {
    data.habits.push({
      id: Date.now().toString(36)+Math.random().toString(36).slice(2),
      name, emoji:selEmoji, color:selColor,
      completions:{}, createdAt:Date.now()
    });
  }
  save(); closeSheet(); renderHabits();
}

/* ─────────────────────────────────────────
   Tab switching
───────────────────────────────────────── */
function switchTab(tab) {
  activeTab = tab;
  document.getElementById('view-today').classList.toggle('hidden', tab!=='today');
  document.getElementById('view-stats').classList.toggle('hidden', tab!=='stats');
  document.getElementById('tab-today').classList.toggle('active', tab==='today');
  document.getElementById('tab-stats').classList.toggle('active', tab==='stats');
  document.getElementById('fab').style.display = tab==='today' ? '' : 'none';
  if (tab==='stats') renderStats();
}

/* ─────────────────────────────────────────
   Stats
───────────────────────────────────────── */
function renderStats() {
  const today  = dateKey();
  const total  = data.habits.length;
  const tdDone = data.habits.filter(h=>h.completions[today]).length;
  const best   = data.habits.reduce((m,h)=>Math.max(m,calcStreak(h)),0);
  const wRates = data.habits.map(calcWeekRate);
  const avgR   = total ? Math.round(wRates.reduce((a,b)=>a+b,0)/total) : 0;

  document.getElementById('st-total').textContent  = total;
  document.getElementById('st-today').textContent  = tdDone;
  document.getElementById('st-streak').textContent = best;
  document.getElementById('st-rate').textContent   = avgR+'%';

  const list = document.getElementById('hstat-list');
  if (!total) { list.innerHTML=`<div style="text-align:center;padding:24px;color:var(--label-secondary);font-size:14px;">No habits yet.</div>`; return; }

  list.innerHTML = data.habits.map(h=>{
    const streak = calcStreak(h);
    const rate   = calcWeekRate(h);
    const color  = colorHex(h.color);
    const since  = new Date(h.createdAt).toLocaleDateString('en-US',{month:'short',day:'numeric'});
    return `<div class="hstat-row">
      <div class="hstat-ico" style="background:${color}22">${h.emoji}</div>
      <div class="hstat-info">
        <div class="hstat-name">${esc(h.name)}</div>
        <div class="hstat-sub">${streak} day streak · since ${since}</div>
      </div>
      <div class="hstat-rate">${rate}%</div>
    </div>`;
  }).join('');
}

/* ─────────────────────────────────────────
   Confetti
───────────────────────────────────────── */
function confetti() {
  const cvs = document.createElement('canvas');
  cvs.className = 'confetti-cvs';
  cvs.width  = window.innerWidth;
  cvs.height = window.innerHeight;
  document.body.appendChild(cvs);
  const ctx = cvs.getContext('2d');
  const COLS = ['#007AFF','#34C759','#FF9500','#FF3B30','#AF52DE','#FF2D55','#5AC8FA'];
  const pts  = Array.from({length:90},()=>({
    x: Math.random()*cvs.width, y: -12,
    size: 6+Math.random()*6,
    col: COLS[Math.floor(Math.random()*COLS.length)],
    vx: (Math.random()-.5)*5, vy: 3+Math.random()*4,
    rot: Math.random()*360, rv: (Math.random()-.5)*9,
    op: 1
  }));
  let raf;
  function draw() {
    ctx.clearRect(0,0,cvs.width,cvs.height);
    pts.forEach(p=>{
      ctx.save();
      ctx.globalAlpha=p.op;
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.col;
      ctx.fillRect(-p.size/2,-p.size*.3,p.size,p.size*.6);
      ctx.restore();
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.rv; p.vy+=0.12;
      if (p.y>cvs.height*.65) p.op=Math.max(0,p.op-.025);
    });
    if (pts.some(p=>p.op>0)) raf=requestAnimationFrame(draw);
    else { cancelAnimationFrame(raf); cvs.remove(); }
  }
  draw();
  setTimeout(()=>{ cancelAnimationFrame(raf); cvs.remove(); },3500);
}

/* ─────────────────────────────────────────
   Utilities
───────────────────────────────────────── */
function esc(s) {
  return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function vibrate() { if(navigator.vibrate) navigator.vibrate(8); }

/* ─────────────────────────────────────────
   Keyboard
───────────────────────────────────────── */
document.addEventListener('keydown',e=>{
  const open = document.getElementById('overlay').classList.contains('open');
  if (e.key==='Escape' && open) { closeSheet(); return; }
  if (e.key==='Enter'  && open) { saveHabit();  return; }
  if ((e.key==='n'||e.key==='N') && !open) openAdd();
});

/* ─────────────────────────────────────────
   Init
───────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', ()=>{
  lucide.createIcons();
  renderDate();

  // Wire buttons
  document.getElementById('fab').addEventListener('click', openAdd);
  document.getElementById('add-first').addEventListener('click', openAdd);
  document.getElementById('edit-btn').addEventListener('click', ()=>{
    if (!data.habits.length) { openAdd(); return; }
    // Toggle all action rows
    const panels = [...document.querySelectorAll('.habit-actions')];
    const anyOpen = panels.some(p=>!p.classList.contains('hidden'));
    panels.forEach(p=>p.classList.toggle('hidden', anyOpen));
    openCard = anyOpen ? null : data.habits[0]?.id;
  });

  // Re-init icons after sheet transition
  document.getElementById('overlay').addEventListener('transitionend',()=>lucide.createIcons());

  // Dark mode toggle → refresh colors
  window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change', e=>{
    isDark=e.matches;
    renderHabits();
    if (activeTab==='stats') renderStats();
  });

  // Seed sample habits on first ever run
  if (!data.habits.length) {
    const samples = [
      {name:'Morning Run',  emoji:'🏃', color:'blue'},
      {name:'Read 20 Pages',emoji:'📚', color:'orange'},
      {name:'Drink Water',  emoji:'💧', color:'teal'},
    ];
    samples.forEach(s=>data.habits.push({
      id: Date.now().toString(36)+Math.random().toString(36).slice(2),
      name:s.name, emoji:s.emoji, color:s.color,
      completions:{}, createdAt:Date.now()
    }));
    save();
  }

  renderHabits();
});
</script>
